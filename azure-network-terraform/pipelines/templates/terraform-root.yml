parameters:
  - name: name
    type: string
  - name: root
    type: string
  - name: serviceConnection # Workload identity federation (OIDC) service connection
    type: string
  - name: environment # ADO environment with approvals/checks for apply
    type: string
  - name: dependsOn
    type: object
    default: [validate]
  - name: applyDependsOn # extra stages the apply must wait for (e.g. hub apply)
    type: object
    default: []

stages:
  - stage: plan_${{ parameters.name }}
    dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - job: plan
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: TerraformInstaller@1
            inputs: { terraformVersion: $(TF_VERSION) }
          - task: AzureCLI@2
            displayName: init + plan
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: ${{ parameters.root }}
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken" ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
                terraform init -input=false -backend-config=backend.hcl
                terraform plan -input=false -lock-timeout=5m -out=tfplan
          - publish: ${{ parameters.root }}/tfplan
            artifact: tfplan_${{ parameters.name }}

  - stage: apply_${{ parameters.name }}
    dependsOn:
      - plan_${{ parameters.name }}
      - ${{ each d in parameters.applyDependsOn }}:
          - ${{ d }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: apply
        environment: ${{ parameters.environment }}
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan_${{ parameters.name }}
                - task: TerraformInstaller@1
                  inputs: { terraformVersion: $(TF_VERSION) }
                - task: AzureCLI@2
                  displayName: apply
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: ${{ parameters.root }}
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken" ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
                      terraform init -input=false -backend-config=backend.hcl
                      terraform apply -input=false -lock-timeout=5m "$(Pipeline.Workspace)/tfplan_${{ parameters.name }}/tfplan"
